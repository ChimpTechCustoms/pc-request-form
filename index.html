<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChimpTech Custom Computing Request Form</title>
        <style>
            body {
                margin: 0;
                background-color: #f0f2f5;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                font-family: sans-serif;
            }

            /* --- Banner --- */
            .header-banner {
                width: 100%;
                height: 100px;
                background-color: #333;
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 1.5rem;
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                flex-shrink: 0; /* Prevents banner from shrinking */
            }

            /* --- Form Wrapper --- */
            /* We wrap the iframe to help control layout */
            .form-container {
                width: 100%;
                max-width: 700px; /* Limits width on big screens for readability */
                margin-bottom: 50px; /* Adds space at the bottom of the page */
            }

            iframe {
                width: 100%;
                border: none;
                overflow: hidden; /* Hides scrollbar */
                
                /* LOGIC: 
                   On Desktop, the form is wider, so it is shorter vertically.
                   We set a safe baseline height here.
                */
                height: 1600px; 
            }

            .banner-img {
                max-width: 90%;      /* Prevents logo from being wider than screen on mobile */
                max-height: 80%;     /* Keeps logo inside the banner height vertically */
                height: auto;        /* Maintains aspect ratio (prevents squishing) */
                width: auto;         /* Maintains aspect ratio */
            }

            /* --- Mobile Scaling Logic --- */
            @media (max-width: 768px) {
                iframe {
                    /* On Mobile, the form gets squeezed. 
                       Text wraps and elements stack, making the form MUCH taller.
                       We drastically increase height to prevent internal scrolling.
                    */
                    height: 2500px; 
                }
                
                .header-banner {
                    font-size: 1.2rem; /* Smaller text for mobile banner */
                    color:darkviolet;
                }
            }
        </style>
    </head>
    <body>

        <div class="header-banner">
            ChimpTech Custom Computing
            <img src="" class="banner-img">
        </div>

        <div class="form-container">
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSc5oE8ncbkKDsYBU0klAI4MiX38eJ46eLc6Gfp_RS73hv4hLA/viewform?embedded=true" 
                scrolling="no">
            </iframe>
        </div>

    </body>
</html>
